[project]
name = "codex-astra-routing"
version = "0.1.0"
description = "Shareable Codex parent/child routing templates and eval adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.60.0",
  "pyyaml>=6.0",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
harbor = ["harbor"]

[project.scripts]
codex-routing = "eval.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eval*"]

[tool.setuptools.package-data]
eval = ["pricing.yaml", "fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
